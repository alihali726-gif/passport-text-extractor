<body>

<div class="container">

    <div class="header">
        <h1>Passport MRZ Extractor</h1>
        <p>استخراج بيانات الجواز من منطقة MRZ</p>
    </div>

    <div class="box">

        <label class="upload" for="files">
            <strong>📷 اختيار صور الجوازات</strong>
            <span>اختار صورة واحدة أو عدة صور دفعة واحدة</span>
        </label>

        <input
            id="files"
            type="file"
            accept="image/*"
            multiple
        >

        <div class="buttons">

            <button
                id="start"
                class="primary"
                disabled
            >
                بدء القراءة
            </button>

            <button
                id="copyAll"
                class="green"
                disabled
            >
                نسخ الكل
            </button>

            <button
                id="clear"
                class="red"
            >
                مسح
            </button>

        </div>

        <div
            id="status"
            class="status"
        >
            لم يتم اختيار صور.
        </div>

        <div class="progress">
            <div
                id="progress"
                class="progress-bar"
            ></div>
        </div>

        <p class="note">
            الصور تتم معالجتها داخل المتصفح. الموقع لا يحتوي على كود لإرسال صور الجوازات إلى سيرفر خاص بك.
        </p>

    </div>

    <div id="results"></div>

<script>

const filesInput =
    document.getElementById("files");

const startButton =
    document.getElementById("start");

const copyAllButton =
    document.getElementById("copyAll");

const clearButton =
    document.getElementById("clear");

const statusBox =
    document.getElementById("status");

const progressBar =
    document.getElementById("progress");

const resultsBox =
    document.getElementById("results");


let files = [];
let results = [];


/* =========================================
   FILES
========================================= */

filesInput.addEventListener(
    "change",
    () => {

        files =
            Array.from(
                filesInput.files
            );

        if (!files.length) {

            startButton.disabled = true;

            statusBox.textContent =
                "لم يتم اختيار صور.";

            return;
        }

        startButton.disabled = false;

        statusBox.textContent =
            `تم اختيار ${files.length} جواز.`;

    }
);


/* =========================================
   STATUS
========================================= */

function status(
    text,
    percent = null
) {

    statusBox.textContent = text;

    if (percent !== null) {

        progressBar.style.width =
            percent + "%";

    }

}


/* =========================================
   LOAD IMAGE
========================================= */

function loadImage(file) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(
                    img.src
                );

                resolve(img);

            };

            img.onerror =
                reject;

            img.src =
                URL.createObjectURL(
                    file
                );

        }
    );

}


/* =========================================
   CROP
========================================= */

function cropBottom(
    img,
    startPercent
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    const width =
        img.naturalWidth;

    const height =
        img.naturalHeight;

    const start =
        Math.floor(
            height *
            startPercent
        );

    const cropHeight =
        height - start;

    /*
        Increase resolution.
    */

    const scale =
        Math.min(
            4,
            3000 / width
        );

    canvas.width =
        Math.floor(
            width * scale
        );

    canvas.height =
        Math.floor(
            cropHeight * scale
        );

    const ctx =
        canvas.getContext("2d");

    ctx.imageSmoothingEnabled = true;

    ctx.imageSmoothingQuality =
        "high";

    ctx.drawImage(
        img,
        0,
        start,
        width,
        cropHeight,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}


/* =========================================
   GRAYSCALE
========================================= */

function processImage(
    source,
    mode
) {

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        source.width;

    canvas.height =
        source.height;

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        source,
        0,
        0
    );

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let gray =
            (
                data[i] * 0.299 +
                data[i + 1] * 0.587 +
                data[i + 2] * 0.114
            );

        /*
            Contrast.
        */

        gray =
            ((gray - 128) * 1.8)
            + 128;

        if (mode === 1) {

            gray =
                gray > 145
                    ? 255
                    : 0;

        }

        if (mode === 2) {

            gray =
                gray > 175
                    ? 255
                    : 0;

        }

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas;
}


/* =========================================
   OCR
========================================= */

async function OCR(
    canvas,
    psm
) {

    const result =
        await Tesseract.recognize(
            canvas,
            "eng",
            {

                logger: m => {

                    if (
                        m.status ===
                        "recognizing text"
                    ) {

                        const p =
                            Math.round(
                                m.progress *
                                100
                            );

                        status(
                            "قراءة MRZ: " +
                            p +
                            "%",
                            p
                        );

                    }

                },

                tessedit_char_whitelist:
                    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<",

                tessedit_pageseg_mode:
                    String(psm)

            }
        );

    return result.data;
}


/* =========================================
   NORMALIZE
========================================= */

function normalizeLine(
    line
) {

    return line
        .toUpperCase()
        .replace(/«/g, "<")
        .replace(/»/g, "<")
        .replace(/‹/g, "<")
        .replace(/›/g, "<")
        .replace(/ /g, "")
        .replace(/[^A-Z0-9<]/g, "");

}


/* =========================================
   IMPORTANT:
   PRESERVE OCR LINES
========================================= */

function getOCRLines(
    text
) {

    if (!text) {
        return [];
    }

    return text
        .split(/\r?\n/)
        .map(normalizeLine)
        .filter(
            line =>
                line.length >= 20
        );

}


/* =========================================
   OCR WORDS / LINES
========================================= */

function collectOCRLines(
    data
) {

    let output = [];

    /*
        Tesseract lines.
    */

    if (
        data &&
        Array.isArray(
            data.lines
        )
    ) {

        for (
            const line
            of data.lines
        ) {

            const value =
                normalizeLine(
                    line.text
                );

            if (
                value.length >= 20
            ) {

                output.push(value);

            }

        }

    }

    /*
        Fallback text.
    */

    if (
        data &&
        data.text
    ) {

        output.push(
            ...getOCRLines(
                data.text
            )
        );

    }

    return [
        ...new Set(output)
    ];

}


/* =========================================
   MRZ CHARACTER RULE
========================================= */

function validMRZChars(
    value
) {

    return /^[A-Z0-9<]+$/
        .test(value);

}


/* =========================================
   LINE 1 SCORE
========================================= */

function scoreLine1(
    line
) {

    let score = 0;

    if (
        line.length === 44
    ) {
        score += 50;
    }

    if (
        line.startsWith("P<")
    ) {
        score += 100;
    }

    if (
        /^P[A-Z<][A-Z]{3}/
            .test(line)
    ) {
        score += 50;
    }

    /*
        Issuing country.
    */

    if (
        /^[A-Z<]{5}/
            .test(line)
    ) {
        score += 10;
    }

    /*
        Names normally contain <<
    */

    if (
        line.includes("<<")
    ) {
        score += 40;
    }

    return score;
}


/* =========================================
   LINE 2 SCORE
========================================= */

function scoreLine2(
    line
) {

    let score = 0;

    if (
        line.length === 44
    ) {
        score += 50;
    }

    /*
        Position 10 should
        normally be a digit.
    */

    if (
        /^\w{9}\d/
            .test(line)
    ) {
        score += 30;
    }

    /*
        Nationality.
    */

    if (
        /^[A-Z0-9<]{10}[A-Z]{3}/
            .test(line)
    ) {
        score += 30;
    }

    /*
        DOB.
    */

    if (
        /^.{13}\d{6}\d/
            .test(line)
    ) {
        score += 30;
    }

    /*
        Sex.
    */

    if (
        /^.{20}[MF<]/
            .test(line)
    ) {
        score += 30;
    }

    /*
        Expiry.
    */

    if (
        /^.{21}\d{6}\d/
            .test(line)
    ) {
        score += 30;
    }

    return score;
}


/* =========================================
   CHECK DIGIT
========================================= */

function valueOf(
    char
) {

    if (
        char === "<"
    ) {
        return 0;
    }

    if (
        char >= "0" &&
        char <= "9"
    ) {
        return Number(char);
    }

    if (
        char >= "A" &&
        char <= "Z"
    ) {

        return (
            char.charCodeAt(0) -
            55
        );

    }

    return 0;
}


function checkDigit(
    value
) {

    const weights =
        [7, 3, 1];

    let total = 0;

    for (
        let i = 0;
        i < value.length;
        i++
    ) {

        total +=
            valueOf(
                value[i]
            ) *
            weights[
                i % 3
            ];

    }

    return String(
        total % 10
    );
}


function validCheck(
    value,
    digit
) {

    return (
        /^\d$/.test(digit) &&
        checkDigit(value) === digit
    );

}


/* =========================================
   VALIDATE
========================================= */

function validate(
    a,
    b
) {

    if (
        a.length !== 44 ||
        b.length !== 44
    ) {

        return {
            valid: false,
            score: 0,
            checks: {}
        };

    }

    const passport =
        validCheck(
            b.substring(0, 9),
            b[9]
        );

    const birth =
        validCheck(
            b.substring(13, 19),
            b[19]
        );

    const expiry =
        validCheck(
            b.substring(21, 27),
            b[27]
        );

    const personal =
        validCheck(
            b.substring(28, 42),
            b[42]
        );

    const composite =
        validCheck(
            b.substring(0, 10) +
            b.substring(13, 20) +
            b.substring(21, 43),
            b[43]
        );

    let score = 0;

    if (passport)
        score += 30;

    if (birth)
        score += 25;

    if (expiry)
        score += 25;

    if (personal)
        score += 10;

    if (composite)
        score += 40;

    /*
        We require the important
        fields to validate.

        Do NOT accept random OCR.
    */

    const valid =
        passport &&
        birth &&
        expiry &&
        composite;

    return {

        valid,

        score,

        checks: {
            passport,
            birth,
            expiry,
            personal,
            composite
        }

    };

}


/* =========================================
   CORRECT COMMON OCR ERRORS
========================================= */

function correctLine2(
    line
) {

    let chars =
        line.split("");

    /*
        Positions which MUST be digits.
    */

    const digitPositions = [
        9,
        19,
        27,
        42,
        43
    ];

    for (
        const pos
        of digitPositions
    ) {

        if (
            !chars[pos]
        ) continue;

        const c =
            chars[pos];

        if (c === "O")
            chars[pos] = "0";

        if (c === "I")
            chars[pos] = "1";

        if (c === "L")
            chars[pos] = "1";

        if (c === "Z")
            chars[pos] = "2";

        if (c === "S")
            chars[pos] = "5";

        if (c === "B")
            chars[pos] = "8";

    }

    /*
        Nationality positions
        should be letters.
    */

    for (
        let i = 10;
        i <= 12;
        i++
    ) {

        if (
            chars[i] === "0"
        ) {
            chars[i] = "O";
        }

        if (
            chars[i] === "1"
        ) {
            chars[i] = "I";
        }

    }

    /*
        Sex.
    */

    if (
        chars[20] === "1"
    ) {
        chars[20] = "I";
    }

    return chars.join("");

}


/* =========================================
   REPAIR LENGTH
   ONLY TRIM OCR EXCESS.
   NEVER INVENT CHARACTERS.
========================================= */

function make44Candidates(
    line
) {

    line =
        normalizeLine(line);

    const output = [];

    if (
        line.length === 44
    ) {

        output.push(line);

        return output;

    }

    /*
        If OCR produced >44,
        test every 44-char window.
    */

    if (
        line.length > 44
    ) {

        for (
            let i = 0;
            i <= line.length - 44;
            i++
        ) {

            output.push(
                line.substring(
                    i,
                    i + 44
                )
            );

        }

    }

    /*
        IMPORTANT:
        We do NOT pad short lines.

        Padding was one of the causes
        of false MRZ results in previous version.
    */

    return output;

}


/* =========================================
   FIND BEST PAIR
========================================= */

function findBestPair(
    lines
) {

    let line1Candidates = [];
    let line2Candidates = [];

    for (
        const line of lines
    ) {

        for (
            const candidate
            of make44Candidates(line)
        ) {

            const corrected =
                correctLine2(
                    candidate
                );

            /*
                Possible line 1.
            */

            if (
                scoreLine1(
                    candidate
                ) >= 60
            ) {

                line1Candidates.push(
                    candidate
                );

            }

            /*
                Possible line 2.
            */

            if (
                scoreLine2(
                    corrected
                ) >= 60
            ) {

                line2Candidates.push(
                    corrected
                );

            }

        }

    }

    let best = null;

    for (
        const a
        of line1Candidates
    ) {

        for (
            const b
            of line2Candidates
        ) {

            const validation =
                validate(
                    a,
                    b
                );

            let score =
                scoreLine1(a) +
                scoreLine2(b) +
                validation.score;

            if (
                best === null ||
                score > best.score
            ) {

                best = {

                    line1: a,
                    line2: b,

                    validation,

                    score

                };

            }

        }

    }

    return best;

}


/* =========================================
   NAME
========================================= */

function parseName(
    line
) {

    const value =
        line.substring(
            5,
            44
        );

    const parts =
        value.split("<<");

    const surname =
        (
            parts[0] || ""
        )
        .replace(
            /<+/g,
            " "
        )
        .trim();

    const given =
        (
            parts[1] || ""
        )
        .replace(
            /<+/g,
            " "
        )
        .trim();

    return {
        surname,
        given
    };

}


/* =========================================
   DATE
========================================= */

function parseDate(
    raw,
    type
) {

    if (
        !/^\d{6}$/.test(raw)
    ) {
        return "غير موثوق";
    }

    const yy =
        Number(
            raw.substring(
                0,
                2
            )
        );

    const mm =
        Number(
            raw.substring(
                2,
                4
            )
        );

    const dd =
        Number(
            raw.substring(
                4,
                6
            )
        );

    if (
        mm < 1 ||
        mm > 12 ||
        dd < 1 ||
        dd > 31
    ) {

        return "غير موثوق";

    }

    let year;

    const now =
        new Date();

    const currentYear =
        now.getFullYear();

    if (
        type === "birth"
    ) {

        const currentYY =
            currentYear % 100;

        year =
            yy > currentYY
                ? 1900 + yy
                : 2000 + yy;

    }

    else {

        /*
            Expiry is normally
            2000+YY for current passports.
        */

        year =
            2000 + yy;

    }

    return (
        String(dd).padStart(2, "0") +
        "/" +
        String(mm).padStart(2, "0") +
        "/" +
        year
    );

}


/* =========================================
   PARSE
========================================= */

function parsePassport(
    line1,
    line2,
    validation
) {

    const name =
        parseName(
            line1
        );

    const passportNumber =
        line2
            .substring(
                0,
                9
            )
            .replace(
                /<+$/g,
                ""
            );

    const nationality =
        line2.substring(
            10,
            13
        );

    const birth =
        line2.substring(
            13,
            19
        );

    const sex =
        line2[20];

    const expiry =
        line2.substring(
            21,
            27
        );

    return {

        surname:
            name.surname,

        given:
            name.given,

        fullName:
            [
                name.given,
                name.surname
            ]
            .filter(Boolean)
            .join(" "),

        passportNumber,

        nationality,

        birthDate:
            parseDate(
                birth,
                "birth"
            ),

        sex:
            sex === "M"
                ? "ذكر"
                : sex === "F"
                    ? "أنثى"
                    : "غير محدد",

        expiryDate:
            parseDate(
                expiry,
                "expiry"
            ),

        line1,
        line2,

        validation

    };

}


/* =========================================
   PROCESS IMAGE
========================================= */

async function processFile(
    file
) {

    const img =
        await loadImage(
            file
        );

    let allLines = [];

    /*
        Try several bottom regions.
    */

    const cropPositions = [
        0.55,
        0.60,
        0.65
    ];

    const imageModes = [
        0,
        1,
        2
    ];

    const pageModes = [
        6,
        11,
        7
    ];

    for (
        const cropPosition
        of cropPositions
    ) {

        const crop =
            cropBottom(
                img,
                cropPosition
            );

        for (
            const imageMode
            of imageModes
        ) {

            const image =
                imageMode === 0
                    ? crop
                    : processImage(
                        crop,
                        imageMode
                    );

            for (
                const psm
                of pageModes
            ) {

                status(
                    `تحليل ${file.name} ...`
                );

                const data =
                    await OCR(
                        image,
                        psm
                    );

                const lines =
                    collectOCRLines(
                        data
                    );

                allLines.push(
                    ...lines
                );

                /*
                    Test immediately.
                */

                const best =
                    findBestPair(
                        allLines
                    );

                if (
                    best &&
                    best.validation.valid
                ) {

                    return best;

                }

            }

        }

    }

    return findBestPair(
        allLines
    );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   DISPLAY
========================================= */

function display(
    file,
    best,
    index
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "card";


    /*
        No reliable MRZ.
    */

    if (
        !best ||
        !best.validation.valid
    ) {

        card.innerHTML = `

            <h2>الجواز ${index + 1}</h2>

            <div class="filename">
                ${escapeHTML(file.name)}
            </div>

            <div class="result warning">
                ⚠️ لم يتم اعتماد البيانات
            </div>

            <p class="note">
                الموقع وجد نصوصًا محتملة، لكن لم تستوفِ
                شروط التحقق الخاصة بالـMRZ.
                لذلك لن أعرض اسمًا أو رقم جواز عشوائي.
            </p>

        `;

        resultsBox.appendChild(
            card
        );

        return;

    }


    const data =
        parsePassport(
            best.line1,
            best.line2,
            best.validation
        );

    results.push(
        data
    );


    const c =
        data.validation.checks;


    card.innerHTML = `

        <h2>الجواز ${index + 1}</h2>

        <div class="filename">
            ${escapeHTML(file.name)}
        </div>

        <div class="result success">
            ✅ تم التحقق من MRZ
        </div>

        <div class="fields">

            <div class="field">
                <label>الاسم الكامل</label>
                <div class="value">
                    ${escapeHTML(data.fullName)}
                </div>
            </div>

            <div class="field">
                <label>اسم العائلة</label>
                <div class="value">
                    ${escapeHTML(data.surname)}
                </div>
            </div>

            <div class="field">
                <label>الأسماء</label>
                <div class="value">
                    ${escapeHTML(data.given)}
                </div>
            </div>

            <div class="field">
                <label>رقم الجواز</label>
                <div class="value">
                    ${escapeHTML(data.passportNumber)}
                </div>
            </div>

            <div class="field">
                <label>الجنسية</label>
                <div class="value">
                    ${escapeHTML(data.nationality)}
                </div>
            </div>

            <div class="field">
                <label>تاريخ الميلاد</label>
                <div class="value">
                    ${escapeHTML(data.birthDate)}
                </div>
            </div>

            <div class="field">
                <label>الجنس</label>
                <div class="value">
                    ${escapeHTML(data.sex)}
                </div>
            </div>

            <div class="field">
                <label>تاريخ الانتهاء</label>
                <div class="value">
                    ${escapeHTML(data.expiryDate)}
                </div>
            </div>

            <div class="field">
                <label>الدولة المصدرة</label>
                <div class="value">
                    ${escapeHTML(
                        data.line1.substring(
                            2,
                            5
                        )
                    )}
                </div>
            </div>

            <div class="field full">
                <label>MRZ</label>

                <div class="mrz">

                    ${escapeHTML(
                        data.line1
                    )}

                    <br>

                    ${escapeHTML(
                        data.line2
                    )}

                </div>
            </div>

        </div>

        <div class="checks">

            <strong>
                فحص البيانات:
            </strong>

            <br>

            رقم الجواز:
            ${c.passport ? "✅" : "❌"}

            <br>

            تاريخ الميلاد:
            ${c.birth ? "✅" : "❌"}

            <br>

            تاريخ الانتهاء:
            ${c.expiry ? "✅" : "❌"}

            <br>

            البيانات الإضافية:
            ${c.personal ? "✅" : "❌"}

            <br>

            MRZ الكامل:
            ${c.composite ? "✅" : "❌"}

        </div>

        <div class="buttons">

            <button
                class="green"
                onclick="copyOne(${results.length - 1})"
            >
                نسخ البيانات
            </button>

        </div>

    `;

    resultsBox.appendChild(
        card
    );

}


/* =========================================
   COPY ONE
========================================= */

async function copyOne(
    index
) {

    const d =
        results[index];

    if (!d) return;

    const text =

`الاسم الكامل: ${d.fullName}
اسم العائلة: ${d.surname}
الأسماء: ${d.given}
رقم الجواز: ${d.passportNumber}
الجنسية: ${d.nationality}
تاريخ الميلاد: ${d.birthDate}
الجنس: ${d.sex}
تاريخ الانتهاء: ${d.expiryDate}
الدولة المصدرة: ${d.line1.substring(2,5)}

MRZ:
${d.line1}
${d.line2}`;

    await navigator.clipboard.writeText(
        text
    );

    alert(
        "تم نسخ البيانات"
    );

}

   COPY ALL
========================================= */

copyAllButton.addEventListener(
    "click",
    async () => {

        if (!results.length)
            return;

        const text =
            results
                .map(
                    (d, i) =>

`الجواز ${i + 1}

اسم العائلة: ${d.surname}
الأسماء: ${d.given}
رقم الجواز: ${d.passportNumber}
الجنسية: ${d.nationality}
تاريخ الميلاد: ${d.birthDate}
الجنس: ${d.sex}
تاريخ الانتهاء: ${d.expiryDate}
الدولة المصدرة: ${d.line1.substring(2,5)}

MRZ:
${d.line1}
${d.line2}

-------------------------

                )

/* =========================================
   START
========================================= */

startButton.addEventListener(
    "click",
    async () => {

        if (!files.length)
            return;

        resultsBox.innerHTML = "";

        results = [];

        startButton.disabled = true;

        copyAllButton.disabled = true;

        progressBar.style.width =
            "0%";

        try {

            for (
                let i = 0;
                i < files.length;
                i++
            ) {

                const file =
                    files[i];

                status(
                    `الجواز ${i + 1} من ${files.length}: ${file.name}`,
                    Math.round(
                        (
                            i /
                            files.length
                        ) * 100
                    )
                );

                const best =
                    await processFile(
                        file
                    );

                display(
                    file,
                    best,
                    i
                );

            }

            progressBar.style.width =
                "100%";

            status(
                `انتهت المعالجة. تم فحص ${files.length} جواز.`
            );

            copyAllButton.disabled =
                results.length === 0;

        }

        catch (error) {

            console.error(
                error
            );

            status(
                "حدث خطأ أثناء قراءة الصور. جرّب صورة أوضح."
            );

        }

        startButton.disabled =
            false;

    }
);


/* =========================================
   CLEAR
========================================= */

clearButton.addEventListener(
    "click",
    () => {

        files = [];

        results = [];

        filesInput.value = "";

        resultsBox.innerHTML = "";

        startButton.disabled =
            true;

        copyAllButton.disabled =
            true;

        progressBar.style.width =
            "0%";

        statusBox.textContent =
            "تم مسح البيانات.";

    }
);

</script>
